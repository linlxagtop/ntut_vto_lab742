  <head>

    <!-- Material Icons & Material Button CSS -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
      .mui-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #1976d2;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 12px 24px;
        font-size: 1rem;
        font-family: 'Roboto', sans-serif;
        box-shadow: 0 2px 4px rgba(25, 118, 210, 0.2);
        cursor: pointer;
        transition: background 0.2s, box-shadow 0.2s;
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 1000;
      }
      .mui-btn:hover {
        background: #1565c0;
        box-shadow: 0 4px 8px rgba(25, 118, 210, 0.3);
      }
      .mui-btn .material-icons {
        font-size: 1.3em;
      }
      /* Survey Button Style from ad_h.html */
      .survey-button {
        position: fixed;
        bottom: 30px;
        right: 30px;
        padding: 15px 25px;
        background: linear-gradient(135deg, #4285f4, #0d47a1);
        color: white;
        font-weight: 600;
        font-size: 16px;
        border-radius: 30px;
        text-decoration: none;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
        z-index: 1000;
      }
      .survey-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
      }
      @media (max-width: 768px) {
        .survey-button {
          padding: 12px 18px;
          font-size: 15px;
          bottom: 18px;
          right: 18px;
        }
      }
    </style>


    <style type='text/css'>
      body {
        background-color: #333;
        margin: 0;
        overflow: hidden;
        font-family: 'Roboto', sans-serif;
      }
      canvas {
        position: fixed;
        top: 0;
        /*left: 0;
        width: 100vw*/
        height: 100vh;
      }
      #handTrackerCanvas {
        z-index: 1;
      }
      #VTOCanvas {
        z-index: 2;
      }
      canvas {
        /* mirror the canvas - useful if camera is in selfie mode only: */
        left: 50%;
        transform: translate(-50%, 0%) rotateY(180deg);
      }

      /* 影片播放器樣式 */
      #videoPlayer {
        position: fixed;
        top: 0;
        right: 0;
        width: 33.33vw;
        height: 33.33vh;
        z-index: 4;
        display: none;
        background: #000;
        object-fit: contain;
      }

      .modal {
        display: flex; 
        flex-direction: column;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        transition-duration: 500ms;
        position: fixed;
      }

      #loading {
        background: #1c3e83;
        color: white;
        opacity: 1;
        z-index: 10;
      }
      #loading > div {
        margin: auto;
        font-size: 32pt;
      }

      #instructions {
        z-index: 9;
        background-color: rgba(0,0,0,0.5);
        color: white;
        font-size: 22px;
      }
      #instructions > div {
        margin: auto;
        text-align: center;
        line-height: 1.5em;
      }
      .instructionsOK {
        border: 1px solid white;
        background: transparent;
        color: white;
        font-size: 22px;
        padding: 22px;
        margin: 1em;
        cursor: pointer;
        width: 200px;
      }
      .instructionsImg {
        margin-top: 12px;
        max-height: 50vh;
        max-width: 50vw;
      }

      /* #changeCamera 样式由 .mui-btn 覆蓋，保留以防其他依赖 */
      #changeCamera {
        z-index: 1000;
      }

      /* 顏色選擇按鈕容器 */
      .color-buttons {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 15px;
        z-index: 100;
        padding: 10px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        backdrop-filter: blur(5px);
      }

      /* 顏色按鈕樣式 */
      .color-button {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        -webkit-tap-highlight-color: transparent;
      }

      /* 按鈕外圈效果 */
      .color-button::after {
        content: '';
        position: absolute;
        top: -4px;
        left: -4px;
        right: -4px;
        bottom: -4px;
        border-radius: 50%;
        border: 2px solid transparent;
        transition: all 0.3s ease;
      }

      /* 選中狀態 */
      .color-button.active::after {
        border-color: white;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      /* 觸摸反饋 */
      .color-button:active {
        transform: scale(0.95);
      }

      /* 各個顏色按鈕 */
      #gold {
        background: linear-gradient(145deg, #817429, #6e6a50);
        box-shadow: 0 4px 8px rgba(130, 116, 41, 0.3);
      }

      #red {
        background: linear-gradient(145deg, #722f37, #4a1f24);
        box-shadow: 0 4px 8px rgba(114, 47, 55, 0.3);
      }

      #black {
        background: linear-gradient(145deg, #333333, #000000);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }

      /* 跑馬燈樣式 */
      #scrollingText {
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        margin: 10px auto;
        border-radius: 5px;
        display: none;
        position: fixed;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        max-width: 600px;
        text-align: center;
        z-index: 99;
        /* 允許多行換行與自動高度 */
        white-space: pre-line;
        word-break: break-all;
        height: auto;
        min-height: 1.5em;
        line-height: 1.5;
        overflow: visible;
      }
      .marquee {
        display: block;
        animation: none;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }
      .marquee.animate {
        opacity: 1;
        animation: scrollUp 1s ease-out;
      }
      @keyframes scrollUp {
        0% {
          transform: translateY(100%);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>

    <div id='canvases'>
      <!-- Canvas displayed above, with the THREE.js scene -->
      <canvas id='VTOCanvas'></canvas>

      <!-- Canvas used by the hand tracker and displaying the video -->
      <canvas id='handTrackerCanvas'></canvas>
    </div>

    <!-- loading modal: -->
    <div id='loading' class='modal'>
      <div>
        LOADING...
      </div>
    </div>

    <!-- instructions: -->
    <div id='instructions' class='modal'>
      <div>
        Place your hand like that:<br/>
        <img src='assets/VTOWristGuidline500px.png' class="instructionsImg" /><br/>
        <button class='instructionsOK' onclick="hide_instructions()">OK</button>
      </div>
    </div>

    <!-- 影片播放器 -->
    <video id="videoPlayer" controls>
      <source type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <!-- 跑馬燈文字 -->
    <div id="scrollingText">
      <div class="marquee"></div>
    </div>

    <!-- 顏色選擇按鈕 -->
    <div class="color-buttons">
      <button id="gold" class="color-button active" onclick="changeWatchColor('gold')"></button>
      <button id="red" class="color-button" onclick="changeWatchColor('red')"></button>
      <button id="black" class="color-button" onclick="changeWatchColor('black')"></button>
    </div>

    <!-- Material UI style Change Camera button -->
    <button onclick="change_camera()" id="changeCamera" class="mui-btn">
      <span class="material-icons">flip_camera_android</span>
      切換鏡頭
    </button>
    <!-- Survey Button (仿 ad_h.html) -->
    <a href="https://forms.gle/yYfmFiMMSeSCvUXp9" class="survey-button" target="_blank">前往填寫問卷</a>
  </body>
</html>
