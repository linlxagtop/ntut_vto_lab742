<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>實驗流程說明</title>
  <style>
    body {
      font-family: "微軟正黑體", sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 90%;
      text-align: center;
      margin: 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #333;
      margin-bottom: 24px;
      font-size: 28px;
    }

    p {
      color: #555;
      line-height: 1.6;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .start-btn {
      background-color: #0078d4;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .start-btn:hover {
      background-color: #005fa3;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 25px;
        width: 85%;
      }
      
      h1 {
        font-size: 24px;
      }
      
      p {
        font-size: 16px;
        margin-bottom: 30px;
      }
      
      .start-btn {
        padding: 16px 32px;
        font-size: 18px;
        width: 80%;
      }
    }
    
    @media (max-width: 375px) {
      .container {
        padding: 20px;
        width: 90%;
      }
      
      h1 {
        font-size: 22px;
      }
      
      p {
        font-size: 16px;
      }
      
      .start-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>實驗流程說明</h1>
    <p style="text-align: left;">
      親愛的參與者您好，感謝您參與本研究！<br>
      請進行ORIENT（東方）腕錶 Web AR 虛擬試戴體驗。並依照畫面與語音指示完成腕錶試戴及錶帶切換後，依真實感受填答問卷。謝謝您的支持與配合！
    </p>
    <button class="start-btn" onclick="startExperiment()">開始參與</button>
  </div>

  <script>

    function startExperiment() {
      window.location.href = "../vto12.html?s=11&g=mu_zilin&res=materials";
    }
  </script>
</body>
</html>
