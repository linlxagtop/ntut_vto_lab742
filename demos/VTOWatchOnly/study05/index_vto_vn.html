<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mô tả quy trình thí nghiệm</title>
  <style>
    body {
      font-family: "微軟正黑體", sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 90%;
      text-align: center;
      margin: 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #333;
      margin-bottom: 24px;
      font-size: 28px;
    }

    p {
      color: #555;
      line-height: 1.6;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .start-btn {
      background-color: #0078d4;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .start-btn:hover {
      background-color: #005fa3;
    }
    
    /* 手機版樣式 */
    @media (max-width: 768px) {
      .container {
        padding: 25px;
        width: 85%;
      }
      
      h1 {
        font-size: 24px;
      }
      
      p {
        font-size: 16px;
        margin-bottom: 30px;
      }
      
      .start-btn {
        padding: 16px 32px;
        font-size: 18px;
        width: 80%;
      }
    }
    
    /* 特小螢幕樣式 */
    @media (max-width: 375px) {
      .container {
        padding: 20px;
        width: 90%;
      }
      
      h1 {
        font-size: 22px;
      }
      
      p {
        font-size: 16px;
      }
      
      .start-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mô tả quy trình thí nghiệm</h1>
    <p style="text-align: left;">
      Kính chào Quý khách, xin chào mừng đến với đồng hồ DW.<br>
Sau đây, Quý khách sẽ xem nội dung quảng cáo đồng hồ DW. Sau khi xem xong, vui lòng dựa trên cảm nhận thực tế của bản thân để hoàn thành bảng câu hỏi.<br>
Xin chân thành cảm ơn sự tham gia của Quý khách!<br>
    </p>
    <button class="start-btn" onclick="startExperiment()">Tiếp tục</button>
  </div>

  <script>
    function startExperiment() {
      const pages = [
        "../vto02.html?s=5vn&g=v2026&c=1&res=materials"
      ];
      const randomIndex = Math.floor(Math.random() * pages.length);
      const selectedPage = pages[randomIndex];
      window.location.href = selectedPage;
    }
  </script>
</body>
</html>
