<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="content-language" content="en-EN" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>WEBARROCKSHAND WATCH VTO DEMO</title>
    
    <!-- INCLUDE WEBARROCKSHAND SCRIPT -->
    <script src="../../dist/WebARRocksHand.js"></script>
    <!-- <script src="../../../../HandTracker.php"></script> -->

    
    <!-- THREE.JS - REPLACE IT BY three.min.js FOR PROD -->
    <script src="../../libs/three/v136/build/three.js"></script>

    <!-- THREE.JS EXTENSIONS -->
    <script src="../../libs/three/v136/examples/js/loaders/GLTFLoader.js"></script>
    <script src="../../libs/three/v136/examples/js/loaders/RGBELoader.js"></script>

    <!-- WEBARROCKSHAND THREEJS VTO HELPER -->
    <script src="../../helpers/HandTrackerThreeHelper.js"></script>

    <!-- change camera helper -->
    <script src="../../helpers/ChangeCameraHelper.js"></script>
    

    <!-- WEBARROCKSHAND POINTS STABILIZER -->
    <script src="../../helpers/landmarksStabilizers/OneEuroLMStabilizer.js"></script>

     <!-- POSEFLIP FILTER -->
    <script src="../../helpers/PoseFlipFilter.js"></script>
    
    <!-- INCLUDE MAIN DEMO SCRIPT -->
    <script src="./main.js"></script>

    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet" />


    <style type='text/css'>
      body {
        background-color: #333;
        margin: 0;
        overflow: hidden;
        font-family: 'Roboto', sans-serif;
      }
      canvas {
        position: fixed;
        top: 0;
        /*left: 0;
        width: 100vw*/
        height: 100vh;
      }
      #handTrackerCanvas {
        z-index: 1;
      }
      #VTOCanvas {
        z-index: 2;
      }
      canvas {
        /* mirror the canvas - useful if camera is in selfie mode only: */
        left: 50%;
        transform: translate(-50%, 0%) rotateY(180deg);
      }

      /* 影片播放器樣式 */
      #videoPlayer {
        position: fixed;
        top: 0;
        right: 0;
        width: 33.33vw;
        height: 50vh;
        z-index: 4;
        display: none;
        background: #000;
        object-fit: contain;
      }

      .modal {
        display: flex; 
        flex-direction: column;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        transition-duration: 500ms;
        position: fixed;
      }

      #loading {
        background: #1c3e83;
        color: white;
        opacity: 1;
        z-index: 10;
      }
      #loading > div {
        margin: auto;
        font-size: 32pt;
      }

      #instructions {
        z-index: 9;
        background-color: rgba(0,0,0,0.5);
        color: white;
        font-size: 22px;
      }
      #instructions > div {
        margin: auto;
        text-align: center;
        line-height: 1.5em;
      }
      .instructionsOK {
        border: 1px solid white;
        background: transparent;
        color: white;
        font-size: 22px;
        padding: 22px;
        margin: 1em;
        cursor: pointer;
        width: 200px;
      }
      .instructionsImg {
        margin-top: 12px;
        max-height: 50vh;
        max-width: 50vw;
      }

      #changeCamera {
        display: none;
        position: fixed;
        z-index: 4;
        bottom: 6px;
        left: 6px;
        background-color: rgba(0,0,0,0.5);
        color: white;
        font-variant: small-caps;
        border: none;
        padding: 12px;
      }

      /* 顏色選擇按鈕容器 */
      .color-buttons {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 15px;
        z-index: 100;
        padding: 10px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        backdrop-filter: blur(5px);
      }

      /* 顏色按鈕樣式 */
      .color-button {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        -webkit-tap-highlight-color: transparent;
      }

      /* 按鈕外圈效果 */
      .color-button::after {
        content: '';
        position: absolute;
        top: -4px;
        left: -4px;
        right: -4px;
        bottom: -4px;
        border-radius: 50%;
        border: 2px solid transparent;
        transition: all 0.3s ease;
      }

      /* 選中狀態 */
      .color-button.active::after {
        border-color: white;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      /* 觸摸反饋 */
      .color-button:active {
        transform: scale(0.95);
      }

      /* 各個顏色按鈕 */
      #gold {
        background: linear-gradient(145deg, #ffd700, #daa520);
        box-shadow: 0 4px 8px rgba(218, 165, 32, 0.3);
      }

      #red {
        background: linear-gradient(145deg, #722f37, #4a1f24);
        box-shadow: 0 4px 8px rgba(114, 47, 55, 0.3);
      }

      #black {
        background: linear-gradient(145deg, #333333, #000000);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>

    <!-- loading modal: -->
    <div id='loading' class='modal'>
      <div>
        LOADING...
      </div>
    </div>

    <!-- instructions: -->
    <div id='instructions' class='modal'>
      <div>
        Place your hand like that:<br/>
        <img src='assets/VTOWristGuidline500px.png' class="instructionsImg" /><br/>
        <button class='instructionsOK' onclick="hide_instructions()">OK</button>
      </div>
    </div>

    <div id='canvases'>
      <!-- Canvas displayed above, with the THREE.js scene -->
      <canvas id='VTOCanvas'></canvas>

      <!-- Canvas used by the hand tracker and displaying the video -->
      <canvas id='handTrackerCanvas'></canvas>
    </div>

    <!-- 影片播放器 -->
    <video id="videoPlayer" controls>
      <source src="assets/0001.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <!-- 顏色選擇按鈕 -->
    <div class="color-buttons">
      <button id="gold" class="color-button active" onclick="changeWatchColor('gold')"></button>
      <button id="red" class="color-button" onclick="changeWatchColor('red')"></button>
      <button id="black" class="color-button" onclick="changeWatchColor('black')"></button>
    </div>

    <button onclick='change_camera()' id='changeCamera'>Change camera</button>

    <script>
      // 設置活動按鈕
      function setActiveButton(clickedButton) {
        // 移除所有按鈕的 active 類
        document.querySelectorAll('.color-button').forEach(button => {
          button.classList.remove('active');
        });
        // 為點擊的按鈕添加 active 類
        clickedButton.classList.add('active');
      }
    </script>
  </body>
</html>
