<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>實驗流程說明</title>
  <style>
    body {
      font-family: "微軟正黑體", sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      max-width: 600px;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 24px;
    }

    p {
      color: #555;
      line-height: 1.6;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .start-btn {
      background-color: #0078d4;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .start-btn:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>實驗流程說明</h1>
    <p style="text-align: left;">
      尊敬的品牌顧客您好，非常感謝您的光臨，<br>
      現在您將進入到手錶廣告購物情境當中，<br>
      請您觀看完廣告之後，依照您最真實的感受，<br>
      接續填寫問卷。
    </p>
    <button class="start-btn" onclick="startExperiment()">開始實驗</button>
  </div>

  <script>
    function startExperiment() {
      const pages = [
        "study04_story.html"
      ];
      const randomIndex = Math.floor(Math.random() * pages.length);
      const selectedPage = pages[randomIndex];
      window.location.href = selectedPage;
    }
  </script>
</body>
</html>
